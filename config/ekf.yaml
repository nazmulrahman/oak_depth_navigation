oak_ekf:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    transform_timeout: 0.1
    print_diagnostics: true
    odom0: /wheel/odom
    # Fuse measured forward velocity and wheel yaw rate, not integrated wheel pose.
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    imu0: /oak/imu/filtered
    # No magnetic/absolute yaw assumption. The OAK gyro is rotated using its TF.
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
